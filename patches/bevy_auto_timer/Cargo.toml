[package]
name = "bevy_auto_timer"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/kimtinh/bevy_auto_timer"
description = "Bevy plugin for convenent timer"

[lib]
name = "bevy_auto_timer"
path = "src/lib.rs"

[dependencies]
bevy = { version = "0.18", features = ["bevy_state"], default-features = false }

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_state", "bevy_log", "dynamic_linking"], default-features = false }
